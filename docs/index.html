<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SepCare</title>
    <style>
        :root {
            color-scheme: dark;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            text-align: center;
            padding: 24px;
        }
        .hero {
            max-width: 640px;
        }
        .badge {
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 4px 12px;
            border-radius: 999px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
            margin: 0 0 16px;
            letter-spacing: -0.02em;
        }
        p {
            font-size: 1.05rem;
            color: #94a3b8;
            line-height: 1.6;
            margin: 0 0 32px;
        }
        a.link {
            display: inline-block;
            padding: 12px 24px;
            background: #0ea5e9;
            color: #fff;
            font-weight: 600;
            text-decoration: none;
            border-radius: 10px;
            transition: background 0.15s ease;
        }
        a.link:hover {
            background: #0284c7;
        }
    </style>
</head>
<body>
    <div class="hero">
        <span class="badge">Coming Soon</span>
        <h1>SepCare</h1>
        <p>Early neonatal sepsis detection and monitoring, built for caregivers and clinical workers alike.</p>
        <a class="link" href="design-system.html">View Design System</a>
    </div>
</body>
</html>
