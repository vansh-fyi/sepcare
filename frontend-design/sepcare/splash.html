<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SepCare</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @keyframes emerge {
      0% {
        opacity: 0;
        transform: scale(0.96);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .animate-emerge {
      animation: emerge 450ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: opacity, transform;
    }

    .logo-blend {
      mix-blend-mode: multiply;
      filter: contrast(1.02) brightness(1.01);
    }
  </style>
</head>
<body class="bg-[#FFFFFF] min-h-screen min-h-[100dvh] flex items-center justify-center m-0 p-0 overflow-hidden select-none">

  <!-- Centered SepCare Logo -->
  <img 
    id="sepcareLogo"
    src="../assets/sepcare-logo.jpg" 
    alt="SepCare" 
    class="w-48 sm:w-56 max-w-[60vw] max-h-[60vh] object-contain logo-blend animate-emerge"
  />

  <script>
    // Automated smooth navigation to profile-selection.html after logo emergence and brief pause (~1.3s total)
    setTimeout(() => {
      const logo = document.getElementById('sepcareLogo');
      if (logo) {
        logo.style.transition = 'opacity 0.25s ease-out';
        logo.style.opacity = '0';
      }
    }, 1050);

    setTimeout(() => {
      window.location.href = 'profile-selection.html';
    }, 1300);
  </script>
</body>
</html>
