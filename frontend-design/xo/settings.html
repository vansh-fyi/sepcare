<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SepCare — Settings</title>
  <meta name="description" content="SepCare Account, Baby Profiles, Notifications, Connected Device, and App Preferences Settings.">

  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Outfit"', '"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          boxShadow: {
            'phone': '0 25px 70px -15px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(0, 0, 0, 0.05)',
            'card': '0 2px 10px -2px rgba(15, 23, 42, 0.03)',
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F8FAFC;
    }

    .settings-row {
      transition: background-color 0.15s ease;
    }
    .settings-row:active {
      background-color: #F8FAFC;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-6 md:p-10 select-none antialiased">

  <!-- =========================================================================
       DEVICE FRAME WRAPPER
       Renders exact mobile frame on tablet/desktop & native full-bleed on mobile
       ========================================================================= -->
  <div class="w-full sm:max-w-[390px] min-h-screen sm:min-h-[844px] bg-white sm:rounded-[52px] sm:shadow-phone sm:border-[8px] sm:border-white relative flex flex-col justify-between overflow-hidden">

    <!-- Screen Content Container -->
    <div class="w-full flex-1 flex flex-col px-6 pt-3 pb-8 relative">

      <!-- =====================================================================
           01 — STATUS BAR (0:01, Cellular, Wi-Fi, Battery)
           ===================================================================== -->
      <div class="w-full flex justify-between items-center py-2 text-slate-900 select-none">
        <!-- Left: Time (0:01 as in reference image) -->
        <span class="text-[15px] font-bold tracking-tight pl-1.5" id="liveClock">0:01</span>

        <!-- Right: System Icons -->
        <div class="flex items-center gap-1.5 pr-1">
          <!-- Cellular Signal (4 bars) -->
          <svg class="w-4 h-3 text-slate-900" viewBox="0 0 18 12" fill="currentColor" aria-label="Full signal">
            <rect x="0" y="8.5" width="2.6" height="3.5" rx="0.6" />
            <rect x="4.2" y="6" width="2.6" height="6" rx="0.6" />
            <rect x="8.4" y="3.5" width="2.6" height="8.5" rx="0.6" />
            <rect x="12.6" y="0.5" width="2.6" height="11.5" rx="0.6" />
          </svg>

          <!-- Wi-Fi Icon -->
          <svg class="w-4 h-3.5 text-slate-900 ml-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-label="Wi-Fi connected">
            <path d="M5 12.55a11 11 0 0 1 14.08 0" />
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
            <circle cx="12" cy="20" r="1" fill="currentColor" stroke="none" />
          </svg>

          <!-- Battery Icon -->
          <div class="flex items-center ml-0.5" aria-label="Battery">
            <div class="w-[22px] h-[11.5px] border-[1.8px] border-slate-900 rounded-[4px] p-[1.5px] flex items-center">
              <div class="h-full w-[90%] bg-slate-900 rounded-[1.5px]"></div>
            </div>
            <div class="w-[1.5px] h-[4.5px] bg-slate-900 rounded-r-[1px] ml-[1px]"></div>
          </div>
        </div>
      </div>

      <!-- =====================================================================
           02 — TOP NAVIGATION: BACK BUTTON & TITLE
           ===================================================================== -->
      <div class="flex items-center gap-4 mt-2 mb-6">
        <!-- Back Button -->
        <a href="../../parentsdashboard.html" onclick="if(history.length>1){history.back();return false;}" class="w-11 h-11 rounded-2xl border border-slate-300/80 bg-white flex items-center justify-center text-slate-900 hover:bg-slate-50 active:scale-95 transition-all shadow-xs cursor-pointer" title="Back" aria-label="Back">
          <svg class="w-5 h-5 -ml-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </a>

        <!-- Screen Title -->
        <h1 class="text-[23px] font-black text-slate-900 tracking-tight leading-none">
          Settings
        </h1>
      </div>

      <!-- =====================================================================
           03 — SECTION 1: ACCOUNT AND BABY
           ===================================================================== -->
      <div class="w-full mb-6">
        <!-- Section Label -->
        <h2 class="text-[12px] font-extrabold uppercase tracking-wider text-[#8A9BA8] mb-2.5 pl-1">
          ACCOUNT AND BABY
        </h2>

        <!-- Card Container with Divided Rows -->
        <div class="w-full bg-white rounded-[26px] border border-[#D9E2EC] overflow-hidden shadow-card divide-y divide-slate-100">

          <!-- 01: Profile -->
          <div onclick="showSettingToast('Profile Settings')" role="button" tabindex="0" class="settings-row w-full px-5 py-4 flex items-center justify-between cursor-pointer">
            <div class="flex items-center gap-3.5">
              <!-- User in Circle Icon -->
              <svg class="w-5 h-5 text-slate-900 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <path d="M12 14a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" />
                <path d="M6.168 18.849a6.5 6.5 0 0 1 11.664 0" />
              </svg>
              <span class="text-[15px] font-semibold text-slate-900">Profile</span>
            </div>
            <!-- Chevron Right -->
            <svg class="w-5 h-5 text-slate-400 stroke-[2] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </div>

          <!-- 02: Baby Information -->
          <div onclick="showSettingToast('Baby Information')" role="button" tabindex="0" class="settings-row w-full px-5 py-4 flex items-center justify-between cursor-pointer">
            <div class="flex items-center gap-3.5">
              <!-- Baby Stroller / Pram Icon -->
              <svg class="w-5 h-5 text-slate-900 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="8" cy="20" r="1.8" />
                <circle cx="17" cy="20" r="1.8" />
                <path d="M3 4h2l2.5 10a2 2 0 0 0 2 1.5h8.5a2 2 0 0 0 2-1.5L22 6H7" />
                <path d="M11 6a4 4 0 0 1 4 4" />
              </svg>
              <span class="text-[15px] font-semibold text-slate-900">Baby Information</span>
            </div>
            <!-- Chevron Right -->
            <svg class="w-5 h-5 text-slate-400 stroke-[2] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </div>

          <!-- 03: Notifications -->
          <a href="../parent-notifications.html" class="settings-row w-full px-5 py-4 flex items-center justify-between cursor-pointer">
            <div class="flex items-center gap-3.5">
              <!-- Bell Icon -->
              <svg class="w-5 h-5 text-slate-900 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
              </svg>
              <span class="text-[15px] font-semibold text-slate-900">Notifications</span>
            </div>
            <!-- Chevron Right -->
            <svg class="w-5 h-5 text-slate-400 stroke-[2] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </a>

          <!-- 04: Emergency Contact -->
          <div onclick="showSettingToast('Emergency Contact (108 Pediatric Unit)')" role="button" tabindex="0" class="settings-row w-full px-5 py-4 flex items-center justify-between cursor-pointer">
            <div class="flex items-center gap-3.5">
              <!-- Emergency Transport / Ambulance Icon -->
              <svg class="w-5 h-5 text-slate-900 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="1" y="5" width="15" height="13" rx="2" />
                <path d="M16 8h4l3 4v6h-7V8z" />
                <circle cx="6" cy="18" r="2" />
                <circle cx="18" cy="18" r="2" />
                <path d="M6 10h4" />
                <path d="M8 8v4" />
              </svg>
              <span class="text-[15px] font-semibold text-slate-900">Emergency Contact</span>
            </div>
            <!-- Chevron Right -->
            <svg class="w-5 h-5 text-slate-400 stroke-[2] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </div>

          <!-- 05: Connected device -->
          <a href="../device-status.html" class="settings-row w-full px-5 py-4 flex items-center justify-between cursor-pointer">
            <div class="flex items-center gap-3.5">
              <!-- Wearable Device Icon with Dot -->
              <div class="relative flex items-center justify-center shrink-0">
                <svg class="w-5 h-5 text-slate-900" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10 3h4v3h-4z" />
                  <rect x="7" y="6" width="10" height="12" rx="3" />
                  <path d="M10 18h4v3h-4z" />
                </svg>
                <span class="absolute top-0 right-0 w-1.5 h-1.5 bg-slate-900 rounded-full"></span>
              </div>
              <span class="text-[15px] font-semibold text-slate-900">Connected device</span>
            </div>
            <!-- Chevron Right -->
            <svg class="w-5 h-5 text-slate-400 stroke-[2] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </a>

        </div>
      </div>

      <!-- =====================================================================
           04 — SECTION 2: APP PREFRENCES
           ===================================================================== -->
      <div class="w-full">
        <!-- Section Label (Exact spelling from reference mockup) -->
        <h2 class="text-[12px] font-extrabold uppercase tracking-wider text-[#8A9BA8] mb-2.5 pl-1">
          APP PREFRENCES
        </h2>

        <!-- Card Container with Divided Rows -->
        <div class="w-full bg-white rounded-[26px] border border-[#D9E2EC] overflow-hidden shadow-card divide-y divide-slate-100">

          <!-- 01: Privacy and Security -->
          <div onclick="showSettingToast('Privacy and Security Settings')" role="button" tabindex="0" class="settings-row w-full px-5 py-4 flex items-center justify-between cursor-pointer">
            <div class="flex items-center gap-3.5">
              <!-- Privacy / Keyhole in Circle Icon -->
              <svg class="w-5 h-5 text-slate-900 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <path d="M12 8a2.5 2.5 0 0 0-2.5 2.5c0 1.1.7 2 1.7 2.3V15a.8.8 0 0 0 1.6 0v-2.2c1-.3 1.7-1.2 1.7-2.3A2.5 2.5 0 0 0 12 8z" />
              </svg>
              <span class="text-[15px] font-semibold text-slate-900">Privacy and Security</span>
            </div>
            <!-- Chevron Right -->
            <svg class="w-5 h-5 text-slate-400 stroke-[2] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </div>

          <!-- 02: Help and Support -->
          <div onclick="showSettingToast('Help and Support Center')" role="button" tabindex="0" class="settings-row w-full px-5 py-4 flex items-center justify-between cursor-pointer">
            <div class="flex items-center gap-3.5">
              <!-- Question in Circle Icon -->
              <svg class="w-5 h-5 text-slate-900 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                <line x1="12" y1="17" x2="12.01" y2="17" stroke-width="2.5" />
              </svg>
              <span class="text-[15px] font-semibold text-slate-900">Help and Support</span>
            </div>
            <!-- Chevron Right -->
            <svg class="w-5 h-5 text-slate-400 stroke-[2] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </div>

        </div>
      </div>

    </div>

    <!-- Home Indicator Bar (Mobile Bezel) -->
    <div class="hidden sm:block absolute bottom-1.5 left-1/2 -translate-x-1/2 w-32 h-1 bg-slate-900/20 rounded-full pointer-events-none"></div>

  </div>

  <!-- Interactive Feedback Toast -->
  <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur-md text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg z-50 pointer-events-none opacity-0 transition-opacity duration-300 flex items-center gap-2">
    <span class="w-1.5 h-1.5 rounded-full bg-[#00D084]" id="toastDot"></span>
    <span id="toastMsg">Action selected</span>
  </div>

  <script>
    // Maintain 0:01 presentation clock from reference mockup (or ?live=1 for live system time)
    function updateClock() {
      const clockEl = document.getElementById('liveClock');
      if (!clockEl) return;
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('live') === '1') {
        const now = new Date();
        let hours = now.getHours();
        let minutes = now.getMinutes();
        minutes = minutes < 10 ? '0' + minutes : minutes;
        clockEl.textContent = `${hours}:${minutes}`;
      } else {
        clockEl.textContent = '0:01';
      }
    }
    updateClock();

    // Setting Toast Helper
    let toastTimeout;
    function showSettingToast(name) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      if (!toast || !toastMsg) return;

      toastMsg.textContent = name;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2000);
    }
  </script>
</body>
</html>
