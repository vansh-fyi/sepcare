<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SepCare — Device Status</title>
  <meta name="description" content="SepCare Device Status: Live battery telemetry, BLE connection monitoring, and band placement diagnostics for Device-SKU-1234.">

  <!-- Google Fonts: Plus Jakarta Sans / Outfit for exact geometric typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Outfit"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            brand: {
              navy: '#103E84',
              navyHover: '#0C326E',
              teal: '#00B574',
              tealBright: '#00D084',
              peachBg: '#FDC5BD',
            }
          },
          boxShadow: {
            'phone': '0 25px 70px -15px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(0, 0, 0, 0.05)',
            'card': '0 2px 12px -2px rgba(15, 23, 42, 0.04)',
            'dock': '0 10px 30px -5px rgba(15, 23, 42, 0.08)',
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F8FAFC;
    }

    /* Progress bar smooth fill animation */
    @keyframes progressGlow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.92; }
    }
    .sc-progress-fill {
      animation: progressGlow 3s ease-in-out infinite;
    }

    /* Subtle pulse on connected state */
    @keyframes subtlePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    .sc-pulse-slow {
      animation: subtlePulse 4s ease-in-out infinite;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-6 md:p-10 select-none antialiased">

  <!-- =========================================================================
       DEVICE FRAME WRAPPER
       Renders exact mobile frame on tablet/desktop & native full-bleed on mobile
       ========================================================================= -->
  <div class="w-full sm:max-w-[390px] min-h-screen sm:min-h-[844px] bg-white sm:rounded-[52px] sm:shadow-phone sm:border-[8px] sm:border-white relative flex flex-col justify-between overflow-hidden">

    <!-- Screen Content Container -->
    <div class="w-full flex-1 flex flex-col px-6 pt-3 pb-8 relative">

      <!-- =====================================================================
           01 — STATUS BAR (9:41, Cellular, Wi-Fi, Battery)
           ===================================================================== -->
      <div class="w-full flex justify-between items-center py-2 text-slate-900 select-none">
        <!-- Left: Time -->
        <span class="text-[15px] font-bold tracking-tight pl-1.5" id="liveClock">9:41</span>

        <!-- Right: System Icons -->
        <div class="flex items-center gap-1.5 pr-1">
          <!-- Cellular Signal (4 bars) -->
          <svg class="w-4 h-3 text-slate-900" viewBox="0 0 18 12" fill="currentColor" aria-label="Full signal">
            <rect x="0" y="8.5" width="2.6" height="3.5" rx="0.6" />
            <rect x="4.2" y="6" width="2.6" height="6" rx="0.6" />
            <rect x="8.4" y="3.5" width="2.6" height="8.5" rx="0.6" />
            <rect x="12.6" y="0.5" width="2.6" height="11.5" rx="0.6" />
          </svg>

          <!-- Wi-Fi Icon -->
          <svg class="w-4 h-3.5 text-slate-900 ml-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-label="Wi-Fi connected">
            <path d="M5 12.55a11 11 0 0 1 14.08 0" />
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
            <circle cx="12" cy="20" r="1" fill="currentColor" stroke="none" />
          </svg>

          <!-- Battery Icon -->
          <div class="flex items-center ml-0.5" aria-label="Battery 90%">
            <div class="w-[22px] h-[11.5px] border-[1.8px] border-slate-900 rounded-[4px] p-[1.5px] flex items-center">
              <div class="h-full w-[90%] bg-slate-900 rounded-[1.5px]"></div>
            </div>
            <div class="w-[1.5px] h-[4.5px] bg-slate-900 rounded-r-[1px] ml-[1px]"></div>
          </div>
        </div>
      </div>

      <!-- =====================================================================
           02 — TOP NAVIGATION: BACK BUTTON & TITLE
           ===================================================================== -->
      <div class="flex items-center gap-4 mt-2 mb-6">
        <!-- Back Button -->
        <a href="../parentsdashboard.html" class="w-11 h-11 rounded-2xl border border-slate-300/80 bg-white flex items-center justify-center text-slate-900 hover:bg-slate-50 active:scale-95 transition-all shadow-xs" title="Back to Dashboard" aria-label="Back">
          <svg class="w-5 h-5 -ml-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </a>

        <!-- Screen Title -->
        <h1 class="text-[23px] font-extrabold text-slate-900 tracking-tight leading-none">
          Device Status
        </h1>
      </div>

      <!-- =====================================================================
           03 — CARD 1: DEVICE-SKU-1234 & STATUS INFO
           ===================================================================== -->
      <div class="w-full bg-white rounded-[26px] border border-slate-200/80 p-5 shadow-card mb-4 transition-all">
        <!-- Card Top Bar: Date & Action Pills -->
        <div class="flex items-center justify-between pb-4">
          <!-- Calendar Date -->
          <div class="flex items-center gap-2 text-slate-800 text-[13px] font-semibold">
            <svg class="w-4 h-4 text-slate-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
              <line x1="16" y1="2" x2="16" y2="6" />
              <line x1="8" y1="2" x2="8" y2="6" />
              <line x1="3" y1="10" x2="21" y2="10" />
            </svg>
            <span>Sun, 16 Aug 2026</span>
          </div>

          <!-- Top Right Action Icons -->
          <div class="flex items-center gap-2">
            <!-- Signal/Bar Chart Toggle Button -->
            <button type="button" onclick="showToast('Telemetry diagnostics live')" class="w-8 h-8 rounded-xl bg-[#B4BAC2] flex items-center justify-center text-white hover:bg-slate-500 active:scale-95 transition-all shadow-2xs" title="Diagnostics">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                <rect x="4" y="11" width="3.2" height="9" rx="1.6" />
                <rect x="10.4" y="5" width="3.2" height="15" rx="1.6" />
                <rect x="16.8" y="13" width="3.2" height="7" rx="1.6" />
              </svg>
            </button>

            <!-- Wearable Device Icon Button -->
            <button type="button" onclick="showToast('Device telemetry synced')" class="w-8 h-8 rounded-xl bg-[#B4BAC2] flex items-center justify-center text-white hover:bg-slate-500 active:scale-95 transition-all relative shadow-2xs" title="Sensor Info">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="7" y="6" width="10" height="12" rx="3" />
                <path d="M10 2h4" />
                <path d="M10 22h4" />
                <path d="M10 6v-4" />
                <path d="M14 6v-4" />
                <path d="M10 18v4" />
                <path d="M14 18v4" />
              </svg>
              <!-- Small White Sensor Dot on Upper Right -->
              <span class="absolute top-1.5 right-1.5 w-1.5 h-1.5 bg-white rounded-full"></span>
            </button>
          </div>
        </div>

        <!-- Middle Content: Peach Icon & Device Title -->
        <div class="flex items-center gap-4 pt-1">
          <!-- Soft Peach Icon Badge -->
          <div class="w-14 h-14 rounded-2xl bg-[#FDC5BD] flex items-center justify-center shrink-0 sc-pulse-slow">
            <div class="relative flex items-center justify-center">
              <!-- Wearable Device Outline -->
              <svg class="w-7 h-7 text-slate-900" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <!-- Top Band Strap -->
                <path d="M10.5 4h7v3h-7z" fill="none" />
                <!-- Main Capsule Screen -->
                <rect x="7" y="7" width="14" height="14" rx="4" />
                <!-- Bottom Band Strap -->
                <path d="M10.5 21h7v3h-7z" fill="none" />
              </svg>
              <!-- Sensor Dot Indicator on Upper Right -->
              <span class="absolute top-0.5 -right-0.5 w-2 h-2 bg-slate-900 rounded-full"></span>
            </div>
          </div>

          <!-- Device SKU & Status Indicators -->
          <div class="flex flex-col">
            <h2 class="text-[17px] font-extrabold text-slate-900 tracking-tight leading-snug">
              Device-SKU-1234
            </h2>

            <div class="flex items-center gap-3 mt-1 text-[12px] font-medium">
              <!-- Monitor Active -->
              <span class="flex items-center gap-1 text-slate-600">
                <svg class="w-3.5 h-3.5 text-[#F59E0B]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                <span>Monitor Active</span>
              </span>

              <!-- Connected -->
              <span class="flex items-center gap-1 text-[#00B574] font-bold">
                <svg class="w-3.5 h-3.5 text-[#F59E0B]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                <span>Connected</span>
              </span>
            </div>
          </div>
        </div>

        <!-- Centered Updated Timestamp -->
        <p class="text-center text-[12px] text-slate-600 font-medium mt-4 pt-1">
          Updated 2 min ago
        </p>
      </div>

      <!-- =====================================================================
           04 — CARD 2: BATTERY STATUS (90% + Progress Bar)
           ===================================================================== -->
      <div class="w-full bg-white rounded-[22px] border border-slate-200/80 p-4 sm:p-5 shadow-card mb-4">
        <!-- Header: Green Battery Icon + Label -->
        <div class="flex items-center gap-2 text-slate-800 font-semibold text-[13px]">
          <!-- Green Battery Icon with Inner Bolt -->
          <div class="relative flex items-center">
            <svg class="w-5 h-5 text-[#00B574]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="7" width="16" height="10" rx="2" ry="2" />
              <line x1="22" y1="11" x2="22" y2="13" stroke-width="2.5" />
              <!-- Inner Bolt Indicator -->
              <path d="M10 9.5l-2 2.5h3l-1.5 2.5" stroke-width="1.8" fill="none" />
            </svg>
          </div>
          <span>Battery</span>
        </div>

        <!-- Percentage Value & Horizontal Progress Bar -->
        <div class="flex items-center gap-4 mt-2.5">
          <!-- 90% in Bright Teal/Emerald -->
          <span class="text-[30px] font-extrabold text-[#00B574] tracking-tight leading-none tabular-nums">
            90%
          </span>

          <!-- Progress Bar Track & Fill -->
          <div class="flex-1 h-3.5 bg-slate-100 rounded-full overflow-hidden">
            <div class="h-full bg-[#00D084] rounded-full sc-progress-fill transition-all duration-700 ease-out" style="width: 90%;" role="progressbar" aria-valuenow="90" aria-valuemin="0" aria-valuemax="100"></div>
          </div>
        </div>
      </div>

      <!-- =====================================================================
           05 — CARD 3: BAND PLACEMENT & RECONNECT BUTTON
           ===================================================================== -->
      <div class="w-full bg-white rounded-[22px] border border-slate-200/80 p-5 shadow-card mb-4">
        <!-- Header: User in Circle Icon + Label -->
        <div class="flex items-center gap-2 text-slate-800 font-semibold text-[13px]">
          <svg class="w-5 h-5 text-slate-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <path d="M12 14a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" />
            <path d="M6.168 18.849a6.5 6.5 0 0 1 11.664 0" />
          </svg>
          <span>Band placement</span>
        </div>

        <!-- Placement Status -->
        <p class="text-[#00B574] font-bold text-[13px] ml-7 mt-0.5">
          Good
        </p>

        <!-- Reconnect Device Button (Deep Navy Blue) -->
        <button 
          type="button" 
          id="btnReconnect" 
          onclick="handleReconnect()" 
          class="w-full mt-5 py-3 rounded-xl bg-[#103E84] hover:bg-[#0C326E] active:scale-[0.98] text-white font-semibold text-[14px] shadow-xs transition-all flex items-center justify-center gap-2 cursor-pointer"
        >
          <span id="reconnectText">Reconnect Device</span>
          <svg id="reconnectSpinner" class="w-4 h-4 animate-spin hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
            <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"></path>
          </svg>
        </button>
      </div>

    </div>


    <!-- Home Indicator Bar (Mobile Bezel) -->
    <div class="hidden sm:block absolute bottom-1.5 left-1/2 -translate-x-1/2 w-32 h-1 bg-slate-900/20 rounded-full pointer-events-none"></div>

  </div>

  <!-- Interactive Feedback Toast -->
  <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur-md text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg z-50 pointer-events-none opacity-0 transition-opacity duration-300 flex items-center gap-2">
    <span class="w-1.5 h-1.5 rounded-full bg-[#00D084]"></span>
    <span id="toastMsg">Notification</span>
  </div>

  <!-- Client-side Interactive Logic -->
  <script>
    // Maintain 9:41 exact mockup presentation time by default (or ?live=1 for live system time)
    function updateClock() {
      const clockEl = document.getElementById('liveClock');
      if (!clockEl) return;
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('live') === '1') {
        const now = new Date();
        let hours = now.getHours();
        let minutes = now.getMinutes();
        minutes = minutes < 10 ? '0' + minutes : minutes;
        clockEl.textContent = `${hours}:${minutes}`;
      } else {
        clockEl.textContent = '9:41';
      }
    }
    updateClock();

    // Toast Notification Helper
    let toastTimeout;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      if (!toast || !toastMsg) return;
      toastMsg.textContent = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2500);
    }

    // Reconnect Device Action
    function handleReconnect() {
      const btn = document.getElementById('btnReconnect');
      const text = document.getElementById('reconnectText');
      const spinner = document.getElementById('reconnectSpinner');

      btn.disabled = true;
      text.textContent = 'Connecting...';
      spinner.classList.remove('hidden');

      setTimeout(() => {
        btn.disabled = false;
        text.textContent = 'Device Reconnected!';
        spinner.classList.add('hidden');
        showToast('Device-SKU-1234 reconnected successfully');

        setTimeout(() => {
          text.textContent = 'Reconnect Device';
        }, 2000);
      }, 1200);
    }
  </script>
</body>
</html>
